# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# build.gradle files instead.

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it easier to discover and migrate existing, packaged, and 3rd party libraries
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enable Jetpack Compose
android.enableJetpackCompose=false

# Gradle memory settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m

# Enable namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and does nothing about the resources declared in
# the library's dependencies,com.example.lib.R will only contain res/ values in each module but not in its dependencies
android.nonTransitiveRClass=true